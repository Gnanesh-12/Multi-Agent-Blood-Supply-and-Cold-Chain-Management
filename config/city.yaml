# Urgency Scoring Weights (default, configurable via UI)
urgency_weights:
  w1_urgency_level: 0.35
  w2_time_to_need: 0.25
  w3_deficit_ratio: 0.15
  w4_blood_type_rarity: 0.15
  w5_waiting_time: 0.10

# Blood Type Rarity Weights (O- is universal donor RBC, highly scarce)
rarity_scores:
  "O-": 1.00
  "AB-": 0.90
  "B-": 0.80
  "A-": 0.70
  "O+": 0.50
  "B+": 0.40
  "A+": 0.35
  "AB+": 0.20

# Cold Chain Rules & Thresholds
safety_rules:
  temp_min_celsius: 1.0
  temp_max_celsius: 10.0
  breach_consecutive_readings: 3
  normal_temp_mean_celsius: 4.0
  normal_temp_std_celsius: 0.3
